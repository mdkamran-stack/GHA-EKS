name: Kubernetes CI

on:
  push:
    branches:
      - main

jobs:
  pyapp-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t kamran0786/gha-pyapp:${GITHUB_SHA::6} .

      - name: Check Docker Hub secrets
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [ -z "$DH_USERNAME" ]; then
            echo "Docker Hub username is EMPTY"
            exit 1
          fi
          if [ -z "$DH_TOKEN" ]; then
            echo "Docker Hub token is EMPTY"
            exit 1
          fi
          echo "Both Docker Hub secrets are available"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        run: docker push kamran0786/gha-pyapp:${GITHUB_SHA::6}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update deployment.yml with latest Docker tag

      - name: Push Docker Image to Docker Hub
        run: docker push kamran0786/gha-pyapp:${GITHUB_SHA::6}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update deployment YAML with latest Docker tag
        run: |
          SHORT_SHA=${GITHUB_SHA::6}
          yq -i '.spec.template.spec.containers[0].image = "kamran0786/gha-pyapp:"'"$SHORT_SHA"'"' pyapp-deployment.yml
          cat pyapp-deployment.yml
        run: |
          SHORT_SHA=${GITHUB_SHA::6}
          yq -i '.spec.template.spec.containers[0].image = "kamran0786/gha-pyapp:'"$SHORT_SHA"'"' pyapp-deployment.yml
          cat deployment.yml
