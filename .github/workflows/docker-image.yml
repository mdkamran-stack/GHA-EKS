name: Kubernetes CI

on:
  push:
    branches:
      - main

jobs:
  pyapp-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t kamran0786/gha-pyapp:${GITHUB_SHA::6} .

      - name: Check Docker Hub secrets
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [ -z "$DH_USERNAME" ]; then
            echo "Docker Hub username is EMPTY"
            exit 1
          fi
          if [ -z "$DH_TOKEN" ]; then
            echo "Docker Hub token is EMPTY"
            exit 1
          fi
          echo "Both Docker Hub secrets are available"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
