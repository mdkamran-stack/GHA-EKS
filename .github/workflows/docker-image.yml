name: Kubernetes CI

on:
  push:
    branches:
      - main

jobs:
  pyapp-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t kamran0786/gha-pyapp:${GITHUB_SHA::6} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push kamran0786/gha-pyapp:${GITHUB_SHA::6}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update deployment image
        run: |
          SHORT_SHA=${GITHUB_SHA::6}
          yq -i '.spec.template.spec.containers[0].image = "kamran0786/gha-pyapp:"'"$SHORT_SHA"'"' pyapp-deployment.yml
          cat pyapp-deployment.yml
