name: Kubernetes CI

on:
  push:
    branches:
      - main

jobs:
  pyapp-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t kamran0786/gha-pyapp:${GITHUB_SHA::6} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push kamran0786/gha-pyapp:${GITHUB_SHA::6}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Update deployment image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_SHA="${IMAGE_TAG:0:6}"
          yq -i '.spec.template.spec.containers[0].image = "kamran0786/gha-pyapp:" + strenv(SHORT_SHA)' pyapp-deployment.yml
          cat pyapp-deployment.yml
      - name: Commit deployment file changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyapp-deployment.yml
          git diff --cached --quiet || git commit -m "Update Docker image tag"
          git push origin main
